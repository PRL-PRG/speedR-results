# Check the layout and every run's metadata whenever the results change.
# Runs on GitHub-hosted runners only; results are written solely by the
# speedR scheduler's ingest job, never by pull requests.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: results
      - uses: actions/checkout@v7
        with:
          repository: PRL-PRG/speedR
          path: speedR
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv run --project speedR speedr check-results results
